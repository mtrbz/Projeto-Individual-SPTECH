<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../public/assets/img/knight.ico"
      type="image/x-icon"
    />
    <title>Hollow Knight</title>

    <!-- Chamando pastas externas -->

    <link rel="stylesheet" href="../public/css/style.css" />
  </head>
  <body>

    <div class="cadastro">

        <div class="container">

            <div class="img-cadastro">

                <div class="itens">
                    <h1>Bem-vindo de volta!</h1> 
                </div>

                <img src="./assets/img/kgniht-and-quirrel-bench.png" alt="">

                <p>Caso já tenha um cadastro, clique aqui para realizar seu login</p>
                <button>Login</button>

            </div>

        <div class="formulario">
            <h1>Cadastrar sua conta</h1>

            <div>
                <p>Nome:</p>
                <input type="text" id="input_nome" placeholder="Nome">
            </div>
            
            <div>
                <p>Email:</p>
                <input type="text" id="input_email" placeholder="Email">
            </div>
            

            <div>
                <p>Senha:</p>
                <input type="password" id="input_senha" placeholder="Senha">
            </div>
           

            <div>
                <p>Confirmar senha:</p>
                <input type="password" id="input_confirmar_senha" placeholder="Confirmar senha">
            </div>

            <button onclick="cadastrar()">Cadastrar</button>

        </div>

        </div>

    </div>

  </body>
</html>
