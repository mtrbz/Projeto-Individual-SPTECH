<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hollow Knight</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" href="./assets/img/knight.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>

  <div class="cadastro">

    <div class="container">

      <div class="formulario">
        <h1>Cadastrar sua conta</h1>

        <div>
          <input type="text" id="input_nome" placeholder="Nome">
        </div>

        <div>
          <input type="text" id="input_email" placeholder="Email">
        </div>
        
        <div>
          <input type="password" id="input_senha" placeholder="Senha">
        </div>
        
        <div>
          <input type="password" id="input_confirmar_senha" placeholder="Confirmar senha">
        </div>
        
        <div>
          <p>Selecione seu personagem favorito!</p>
          <select id="select_favorito">
            <option value="#" selected disabled>Escolha um personagem:</option>
            <option value="cavaleiro-dle.png">Cavaleiro</option>
            <option value="hornet-dle.png">Hornet</option>
            <option value="receptaculo-puro-dle.png">Receptaculo Puro</option>
            <option value="grimm-dle.png">Grimm</option>
            <option value="quirrel-dle.png">Quirrel</option>
            <option value="zote.png">Zote</option>
            <option value="sly-dle.png">Sly</option>
            <option value="radiancia-dle.png">Radiancia</option>
          </select>
        </div>

        <button onclick="cadastrar()">CADASTRAR</button>

        <p style="color: red;" id="mensagem"></p>
  
        <div id="loading" style="display: none;">
          <img src="./assets/hollow-loading.gif" width="80px" alt=""><br>
          <span style="color: white;">Carregando...</span>
        </div>

      </div>

    </div>

  </div>

</body>

</html>

<script>
  // Array para armazenar empresas cadastradas para validação de código de ativação 
  function cadastrar() {

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = input_nome.value;
    var emailVar = input_email.value;
    var senhaVar = input_senha.value;
    var confirmacaoSenhaVar = input_confirmar_senha.value;
    var favoritoVar = select_favorito.value;

    // Verificando se há algum campo em branco
    if (nomeVar == "") {
      mensagem.innerHTML = `Preencha o nome para continuar!`;
    } else if (emailVar == "") {
      mensagem.innerHTML = `Preencha o email para continuar!`;
    } else if (senhaVar == "") {
      mensagem.innerHTML = `Digite sua senha!`;
    } else if (confirmacaoSenhaVar == "") {
      mensagem.innerHTML = `Digite sua senha novamente!`;
    } else if ( confirmacaoSenhaVar != senhaVar) {
      mensagem.innerHTML = `As senhas estão diferentes!`;
    } else if (favoritoVar == '#') {
       mensagem.innerHTML = `Escolha um personagem favorito!`;
    } else {
      mensagem.innerHTML = '';
    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        favoritoServer: favoritoVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          // cardErro.style.display = "block";

          // mensagem_erro.innerHTML =
          //   "Cadastro realizado com sucesso! Redirecionando para tela de Login...";
          loading.style.display = 'block';
          setTimeout(() => {
            window.location = "login.html";
          }, "2500");

        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
    }
  }
</script>
