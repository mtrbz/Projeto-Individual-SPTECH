<script>
    var nomes = ['hornet', 'cavaleiro', 'grimm'];

    var personagens = 
    [
        {
            'nome': 'hornet',
            'tipo': ['Boss', 'NPC'],
            'especie': ['Aranha', 'Receptáculo'],
            'localizacao': ['Caminho Verde', 'Borda do Reino'],
            'forma_dos_sonhos': 'Não',
            'infectado': 'Não',
            'papel': 'Aliado',
            'cor_principal': 'Vermelho',
            'arma' : 'Agulha'
        },

        {
            'nome': 'cavaleiro',
            'tipo': 'Protagonista',
            'especie': 'Receptáculo',
            'localizacao': 'Todas',
            'forma_dos_sonhos': 'Não',
            'infectado': 'Não',
            'papel': 'Jogável',
            'cor_principal': 'Preto',
            'arma': 'Ferrão'
        },

        {
            'nome': 'grimm',
            'tipo': ['Boss', 'NPC'],
            'especie': 'Mariposa',
            'localizacao': 'Dirtmouth',
            'forma_dos_sonhos': 'Sim',
            'infectado': 'Não',
            'papel': 'Boss',
            'cor_principal': 'Vermelho',
            'arma': 'Não possuí'
        }
    ];

    function validar() {
        var tentativa = input_personagem.value.toLowerCase();
        var msg = '';

        for (var i = 0; i < nomes.length; i++) {

            if (nomes[i][0] == tentativa[0]) 

                 if (nomes[i].includes(tentativa)) {
                    msg += `${nomes[i]}<br>`;
                }
        }
        
        mensagem.innerHTML = msg;

    }

    var resultado = {};

    function tentar() {
        var tentativa = input_personagem.value.toLowerCase();
        var personagem = personagens[0];
        var comparar = '';

        for (var i = 0; i < personagens.length; i++) {

            if (personagens[i].nome.toLowerCase() == tentativa) {
                comparar = personagens[i];
            }

        }

        if (comparar.tipo == personagem.tipo) {
            resultado.tipo = 'acertou'
        } else {
            resultado.tipo = 'errou'
        }

        if (comparar.especie == personagem.especie) {
            resultado.especie = 'acertou'
        } else {
            resultado.especie = 'errou'
        }

        if (comparar.localizacao == personagem.localizacao) {
            resultado.localizacao = 'acertou'
        } else {
            resultado.localizacao = 'errou'
        }

        if (comparar.forma_dos_sonhos == personagem.forma_dos_sonhos) {
            resultado.forma_dos_sonhos = 'acertou'
        } else {
            resultado.forma_dos_sonhos = 'errou'
        }

        if (comparar.infectado == personagem.infectado) {
            resultado.infectado = 'acertou'
        } else {
            resultado.infectado = 'errou'
        }

        if (comparar.papel == personagem.papel) {
            resultado.papel = 'acertou'
        } else {
            resultado.papel = 'errou'
        }

        if (comparar.cor_principal == personagem.cor_principal) {
            resultado.cor_principal = 'acertou'
        } else {
            resultado.cor_principal = 'errou'
        }

        if (comparar.arma == personagem.arma) {
            resultado.arma = 'acertou'
        } else {
            resultado.arma = 'errou'
        }

        console.log(resultado);
        
    }

</script>
