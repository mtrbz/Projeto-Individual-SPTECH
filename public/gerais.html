<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hollow Knight</title>

    <script src="./js/sessao.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" href="./assets/img/knight.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
    <!-- Navbar -->

    <div class="header">
        <nav>

            <div></div>

            <div>
                <h1 class="poppins-regular">Estatísticas Gerais</h1>
            </div>

            <div></div>

        </nav>
    </div>

    <!-- Fim header -->
    <div class="estatisticas">

        <div class="barra-lateral">
            <div class="cima">

                <div class="fotoPerfil">
                    <p class="nome-usuario">
                        Olá, <span id="nome_usuario"></span>!
                    </p>

                    <div class="favorito" id="favorito"></div>
                </div>

                <div>
                    <a href="estatisticas.html"><button>Individuais</button></a>
                </div>

                <div>
                    <button>Gerais</button>
                </div>

            </div>

            <div class="baixo">
                <a href="hollowdle.html" class="botao">Voltar</a>
            </div>

        </div>

        <div class="container">

            <div class="linha">

                <div class="box">
                    <h3 class="poppins-regular">Média de Acerto Geral</h3>
                    <div class="kpi" id="acertoGeral"></div>
                </div>

                <div class="box">
                    <h3 class="poppins-regular">Total de Partidas</h3>
                    <div class="kpi" id="divTotalPartidas"></div>
                </div>

            </div>

            <div class="linha">

                <div class="rank">

                    <p>Top 5 Melhores Jogadores</p>

                    <div class="rank-colunas">
                        <div class="rank-linha" id="colocacao"></div>
                        <div class="rank-linha" id="rankNome"></div>
                        <div class="rank-linha" id="rankPontos"></div>
                    </div>
                </div>

                <div class="tentativasGerais">
                    <canvas id="graficoTentativasGerais"></canvas>
                </div>

            </div>

            

        </div>

    </div>
</body>

</html>
<script>

    function obterTentativasGerais() {
        fetch("/partida/obterTentativasGerais")
            .then(resposta => resposta.json())
            .then(resposta => {
                console.log('TO DENTRO DAS GERAIS');
                console.log(`DADOS REECEBIDOS: ${JSON.stringify(resposta)}`);

                plotarTentativasGerais(resposta);
            })
            .catch(erro => {
                console.log(`ERRO: ${erro.message}`)
            })
    }
    obterTentativasGerais();

    function plotarTentativasGerais(resposta) {
        console.log(resposta);

        var labels = [];
        var medias = [];

        for (var i = 0; i < resposta.length; i++) {
            labels.push(resposta[i].nome);
            medias.push(resposta[i].media);
        }

        var dados = {
            labels: labels,
            datasets: [{
                label: 'Vitórias dos jogadores',
                data: medias,
                backgroundColor: '#ffff'
            }]
        }

        const ctx = document.getElementById('graficoTentativasGerais');
        const config = {
            type: 'bar',
            data: dados,
            options: {
                plugins: {
                    legend: {
                        labels: {
                            color: '#ffff'
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            color: '#ffff'
                        }
                    },
                    y: {
                        ticks: {
                            color: '#ffff'
                        }
                    }
                }
            }
        };

        let myChart = new Chart(
            ctx, config
        );
    }

    nome_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function selecionarRank() {
        fetch("/partida/selecionarRank")
            .then(resposta => resposta.json())
            .then (resposta => {
                
                for (var i = 0; i < resposta.length; i++) {
                    colocacao.innerHTML += `<div class='colocacao'>${i + 1}º </div><br>`;
                    rankNome.innerHTML += `<div class='rank-nome'>${resposta[i].nome}</div><br>`;
                    rankPontos.innerHTML += `<div class='rank-pontos'>${resposta[i].pontos}</div><br>`;
                }
            })
            .catch(function (erro) {
                console.log("#ERROR:", erro);
            });
    }

    selecionarRank();

    function selecionarFavorito() {
        var fkUsuario = sessionStorage.ID_USUARIO;

        fetch(`/partida/selecionarFavorito/${fkUsuario}`)
            .then(resposta => resposta.json())
            .then(function (data) {
                console.log('to dentro do favorito', data)

                console.log(`Dados recebidos do favorito: ${JSON.stringify(data)}`);

                var img = `<img src=/assets/img/${data[0].foto}>`;

                favorito.innerHTML = img;

            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos pontos: ${error.message}`);
            });
    }

    selecionarFavorito();

    function porcentagemAcertoGeral() {
        var fkUsuario = sessionStorage.ID_USUARIO;

        fetch(`/partida/porcentagemAcertoGeral`)
            .then(resposta => resposta.json())
            .then(function (data) {
                console.log('to dentro do favorito', data)

                console.log(`Dados recebidos do favorito: ${JSON.stringify(data)}`);

                acertoGeral.innerHTML = `${data[0].media}%`;

            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos pontos: ${error.message}`);
            });
    }

    porcentagemAcertoGeral();

    function totalPartidas() {
        var fkUsuario = sessionStorage.ID_USUARIO;

        fetch(`/partida/totalPartidas`)
            .then(resposta => resposta.json())
            .then(function (data) {
                console.log('to dentro do favorito', data)

                console.log(`Dados recebidos do favorito: ${JSON.stringify(data)}`);

                divTotalPartidas.innerHTML = data[0].total;

            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos pontos: ${error.message}`);
            });
    }

    totalPartidas();

</script>
