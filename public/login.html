<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hollow Knight</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./assets/img/knight.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <div class="login">

        <div class="container">

            <div class="img-cadastro">

                <div class="itens">
                    <h1>Bem-vindo de volta!</h1> 
                </div>

                <img src="./assets/img/kgniht-and-quirrel-bench.png" alt="">

            </div>

            <div class="formulario">
                <h1>Login</h1>

                <div>
                    
                    <input type="text" id="input_email" placeholder="Email">
                </div>

                <div>
                    
                    <input type="password" id="input_senha" placeholder="Senha">
                </div>

                <button onclick="entrar()">ENTRAR</button>

                <p class="poppins-regular">Ainda não tem uma conta? <a class="poppins-regular" href="cadastro.html">Clique aqui</a> para se cadastrar!</p>

            </div>

        </div>

    </div>

</body>

</body>

</html>

<script>

    function entrar() {
        var emailVar = input_email.value;
        var senhaVar = input_senha.value;

        if (emailVar == "" || senhaVar == "") {
            alert('Mensagem de erro para todos os campos em branco');
            return false;
        }
        else {
            alert('Logando...')
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.idUsuario;

                    setTimeout(function () {
                        window.location = "index.html";
                    }, 1000);

                });

            } else {

                alert('Erro ao fazer login')
                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

</script>
